<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="The Intel Analyst Academy - image unavailable">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0e7490" stroke-width="0.5" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <g transform="translate(400 260)">
    <path d="M 0 -90 L 65 -60 L 65 10 Q 65 65 0 95 Q -65 65 -65 10 L -65 -60 Z"
          fill="url(#shield)" opacity="0.95"/>
    <path d="M -25 0 L -8 18 L 30 -20"
          fill="none" stroke="#020617" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="400" y="410" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="24" font-weight="600" fill="#67e8f9" letter-spacing="2">
    THE INTEL ANALYST ACADEMY
  </text>
  <text x="400" y="445" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="14" fill="#64748b" letter-spacing="4">
    IMAGE UNAVAILABLE
  </text>
</svg>
